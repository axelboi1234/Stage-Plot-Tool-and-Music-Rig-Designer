    // Stage Plot (premium feature)
    /* 
    A separate, self-contained popup for planning physical stage layout —
    where people/mics/monitors/amps stand — as opposed to the signal-flow
    canvas behind it. Deliberately kept independent of `state`/`nodes` so
    it works whether or not a signal chain has been built yet.
    */

    const STAGE_ICONS = {
      vocalmic: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9.5" y="2.5" width="5" height="8" rx="2.5"/><path d="M7 9.5a5 5 0 0 0 10 0"/><line x1="12" y1="14.5" x2="12" y2="18"/><line x1="8.5" y1="21" x2="15.5" y2="21"/></svg>`,
      instmic: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="10.3" y="3" width="4.6" height="8" rx="2.3" transform="rotate(35 12.6 7)"/><line x1="9" y1="12" x2="4" y2="18"/><circle cx="4" cy="19.5" r="1" fill="currentColor" stroke="none"/></svg>`,
      di: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="9" rx="1.5"/><line x1="6" y1="12.5" x2="18" y2="12.5"/><circle cx="8.5" cy="12.5" r="1"/><circle cx="15.5" cy="12.5" r="1"/></svg>`,
      wedge: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17V9l18-5v13z"/><circle cx="11" cy="12" r="3"/></svg>`,
      sidefill: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="1.5"/><circle cx="12" cy="8" r="2.6"/><circle cx="12" cy="16" r="1.8"/></svg>`,
      ampcab: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="1.5"/><circle cx="8.5" cy="12" r="3.4"/><circle cx="16" cy="12" r="3.4"/></svg>`,
      riser: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="7" rx="1"/><line x1="5" y1="15" x2="3" y2="20"/><line x1="19" y1="15" x2="21" y2="20"/></svg>`,
      keys: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="2"/><line x1="6" y1="7" x2="6" y2="17"/><rect x="8.5" y="9" width="4" height="2.5" rx="0.5"/><circle cx="17.5" cy="10.5" r="1"/><line x1="10" y1="14" x2="10" y2="17"/><line x1="14" y1="14" x2="14" y2="17"/><line x1="18" y1="14" x2="18" y2="17"/></svg>`,
      power: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><line x1="12" y1="6" x2="12" y2="12"/></svg>`,
      performer: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="3"/><path d="M6 21v-4a6 6 0 0 1 12 0v4"/></svg>`
    };

    //Specify type (similar to category), which will assign the icon, ten the name.
    const STAGE_GEAR = [
      { type: 'vocalmic', label: 'Vocal Mic' },
      { type: 'instmic', label: 'Instrument Mic' },
      { type: 'di', label: 'DI Box' },
      { type: 'wedge', label: 'Monitor' },
      { type: 'sidefill', label: 'Side Fill' },
      { type: 'ampcab', label: 'Amp Cab' },
      { type: 'riser', label: 'Drum Riser' },
      { type: 'keys', label: 'Keyboard' },
      { type: 'power', label: 'Power' },
      { type: 'performer', label: 'Performer' }
    ];

    const STAGE_PX_PER_M = 70; // on-screen scale — deliberately separate from export scale below

    const StagePlot = (() => {
      let overlay, surfaceEl;

      //State of the stage, whether snap and/or grid are on, the size, and the items stored on the canvas
      let stageState = { widthM: 8, depthM: 5, grid: true, snap: true, items: [] };
      let idCounter = 1;
      let dragItem = null, dragStart = null;
      let overlayEventsBound = false;

      function ensure() {
        if (overlay) return;
        overlay = document.createElement('div');
        overlay.className = 'stage-overlay';
        overlay.innerHTML = `
          <div class="stage-modal" role="dialog" aria-modal="true">
            <div class="stage-topbar">
              <h2>Stage Plotter</h2>
              <div class="tb-divider"></div>
              <div class="tb-group">
                <span class="stage-dim-label">Size</span>
                <input type="number" min="2" max="40" class="stage-dim-input" id="stageWidthInput" value="${stageState.widthM}">
                <span class="stage-dim-x">×</span>
                <input type="number" min="2" max="40" class="stage-dim-input" id="stageDepthInput" value="${stageState.depthM}">
                <span class="stage-dim-x" style="margin-right:10px;">m</span>
              </div>
              <div class="tb-divider" style="margin-right:10px;"></div>
              <button type="button" class="stage-toggle" id="stageGridToggle" data-active="true" aria-pressed="true"><span class="stage-toggle-box"><svg viewBox="0 0 24 24" fill="none" stroke="var(--monitor)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg></span>Grid</button>
              <button type="button" class="stage-toggle" id="stageSnapToggle" data-active="true" aria-pressed="true"><span class="stage-toggle-box"><svg viewBox="0 0 24 24" fill="none" stroke="var(--monitor)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg></span>Snap</button>
              <div class="spacer"></div>
              <button class="tb-btn" id="stageClearBtn"">Clear</button>
              <button class="tb-btn" id="stageExportBtn">Export PNG</button>
              <button class="stage-close" id="stageCloseBtn" aria-label="Close">×</button>
            </div>
            <div class="stage-body">
              <div class="stage-sidebar">
                <input class="search-input" id="stageSearch" placeholder="Search…" spellcheck="false">
                <div class="stage-palette-grid" id="stagePaletteRoot"></div>
                <div class="hint">
                  - Drag an item onto the stage, or click to drop it centered. <br>
                  - Drag an item to reposition it. <br>
                  - Hover over item for rotate (↻) / delete (×). <br>
                  - Click a label to rename it. <br>
                </div>
              </div>
              <div class="stage-canvas-col">
                <div class="stage-canvas-wrap" id="stageCanvasWrap">
                  <div class="stage-surface-outer">
                    <div class="stage-surface" id="stageSurface">
                      <div class="stage-foh">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v13"/><path d="M6 12l6 6 6-6"/></svg>
                        <span>Front of House / Audience</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>`;
        document.body.appendChild(overlay);
        surfaceEl = overlay.querySelector('#stageSurface');

        overlay.querySelector('#stageCloseBtn').addEventListener('click', close);
        overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });

        overlay.querySelector('#stageWidthInput').addEventListener('change', (e) => {
          stageState.widthM = Math.max(2, Math.min(40, parseFloat(e.target.value) || stageState.widthM));
          renderSurface();
        });
        overlay.querySelector('#stageDepthInput').addEventListener('change', (e) => {
          stageState.depthM = Math.max(2, Math.min(40, parseFloat(e.target.value) || stageState.depthM));
          renderSurface();
        });
        const gridToggleEl = overlay.querySelector('#stageGridToggle');
        gridToggleEl.addEventListener('click', () => {
          stageState.grid = !stageState.grid;
          gridToggleEl.dataset.active = String(stageState.grid);
          gridToggleEl.setAttribute('aria-pressed', String(stageState.grid));
          renderSurface();
        });
        const snapToggleEl = overlay.querySelector('#stageSnapToggle');
        snapToggleEl.addEventListener('click', () => {
          stageState.snap = !stageState.snap;
          snapToggleEl.dataset.active = String(stageState.snap);
          snapToggleEl.setAttribute('aria-pressed', String(stageState.snap));
        });

        //Listens for a click to occur on the button, then exports a PNG of the stage
        overlay.querySelector('#stageExportBtn').addEventListener('click', exportPNG);

        //Listens for a click to occur on the button, then deletes all items on the stage
        overlay.querySelector('#stageClearBtn').addEventListener('click', deleteAllStageItems);

        buildPalette();
        overlay.querySelector('#stageSearch').addEventListener('input', (e) => {
          const q = e.target.value.trim().toLowerCase();
          overlay.querySelectorAll('.stage-palette-item').forEach(btn => {
            btn.style.display = (!q || btn.dataset.search.includes(q)) ? '' : 'none';
          });
        });

        // Drop from the palette onto the stage
        overlay.querySelector('#stageCanvasWrap').addEventListener('dragover', (e) => {
          if (!e.dataTransfer.types.includes('text/plain')) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'copy';
        });
        overlay.querySelector('#stageCanvasWrap').addEventListener('drop', (e) => {
          const idxStr = e.dataTransfer.getData('text/plain');
          if (idxStr === '') return;
          e.preventDefault();
          const g = STAGE_GEAR[parseInt(idxStr, 10)];
          if (!g) return;
          const rect = surfaceEl.getBoundingClientRect();
          let xM = (e.clientX - rect.left) / STAGE_PX_PER_M;
          let yM = (e.clientY - rect.top) / STAGE_PX_PER_M;
          addItem(g, xM, yM);
        });
      }

      //Creates an item on the stage
      function buildPalette() {
        const root = overlay.querySelector('#stagePaletteRoot');
        root.innerHTML = STAGE_GEAR.map((g, idx) => `
          <button class="stage-palette-item" draggable="true" data-idx="${idx}" data-search="${esc(g.label.toLowerCase())}">
            ${STAGE_ICONS[g.type]}<span>${esc(g.label)}</span>
          </button>`).join('');

        root.addEventListener('click', (e) => {
          const btn = e.target.closest('.stage-palette-item');
          if (!btn) return;
          const g = STAGE_GEAR[parseInt(btn.dataset.idx, 10)];
          if (g) addItem(g, stageState.widthM / 2, stageState.depthM / 2);
        });
        root.addEventListener('dragstart', (e) => {
          const btn = e.target.closest('.stage-palette-item');
          if (!btn) return;
          e.dataTransfer.setData('text/plain', btn.dataset.idx);
          e.dataTransfer.effectAllowed = 'copy';
        });
      }

      function snapM(v) { return stageState.snap ? Math.round(v * 2) / 2 : Math.round(v * 10) / 10; }

      function addItem(g, xM, yM) {
        stageState.items.push({
          id: 'st' + (idCounter++), type: g.type, label: g.label,
          xM: Math.max(0, Math.min(stageState.widthM, snapM(xM))),
          yM: Math.max(0, Math.min(stageState.depthM, snapM(yM))),
          rot: 0
        });
        renderSurface();
      }

      //"Refreshes" the stage plot canvas
      function renderSurface() {
        const w = stageState.widthM * STAGE_PX_PER_M;
        const h = stageState.depthM * STAGE_PX_PER_M;
        surfaceEl.style.width = w + 'px';
        surfaceEl.style.height = h + 'px';
        surfaceEl.style.backgroundSize = stageState.grid ? `${STAGE_PX_PER_M}px ${STAGE_PX_PER_M}px` : '0 0';

        surfaceEl.querySelectorAll('.stage-item').forEach(el => el.remove());
        stageState.items.forEach((it) => {
          const el = document.createElement('div');
          el.className = 'stage-item';
          el.dataset.id = it.id;
          el.style.left = (it.xM * STAGE_PX_PER_M - 29) + 'px';
          el.style.top = (it.yM * STAGE_PX_PER_M - 21) + 'px';
          el.innerHTML = `
            <div class="stage-item-icon">
              <div class="stage-item-icon-inner" style="transform:rotate(${it.rot}deg)">${STAGE_ICONS[it.type] || STAGE_ICONS.performer}</div>
              <button class="stage-item-del" data-stage-del="${it.id}" title="Remove">×</button>
              <button class="stage-item-rotate" data-stage-rot="${it.id}" title="Rotate">↻</button>
            </div>
            <input class="stage-item-label" data-stage-label="${it.id}" value="${esc(it.label)}" spellcheck="false">`;
          surfaceEl.appendChild(el);
        });
      }

      // Item interactions: drag to move, click ↻ to rotate 45°, click × to delete, click label to rename.
      // Rotation is applied only to .stage-item-icon-inner, never to .stage-item-icon itself, so the
      // delete/rotate buttons (children of the outer, unrotated element) always stay put in their corners.
      function bindItemEvents() {
        surfaceEl.addEventListener('mousedown', (e) => {
          const delBtn = e.target.closest('[data-stage-del]');
          if (delBtn) {
            stageState.items = stageState.items.filter(it => it.id !== delBtn.dataset.stageDel);
            renderSurface();
            return;
          }
          const rotBtn = e.target.closest('[data-stage-rot]');
          if (rotBtn) {
            const it = stageState.items.find(it => it.id === rotBtn.dataset.stageRot);
            if (it) {
              it.rot = (it.rot + 45);
              const inner = surfaceEl.querySelector(`.stage-item[data-id="${it.id}"] .stage-item-icon-inner`);
              if (inner) inner.style.transform = `rotate(${it.rot}deg)`;
            }
            return;
          }
          if (e.target.closest('[data-stage-label]')) return; // let the label input take the click
          const tile = e.target.closest('.stage-item');
          if (!tile) return;
          const it = stageState.items.find(it => it.id === tile.dataset.id);
          if (!it) return;
          dragItem = it;
          dragStart = { clientX: e.clientX, clientY: e.clientY, xM: it.xM, yM: it.yM };
          e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
          if (!dragItem) return;
          const dxM = (e.clientX - dragStart.clientX) / STAGE_PX_PER_M;
          const dyM = (e.clientY - dragStart.clientY) / STAGE_PX_PER_M;
          let xM = Math.max(0, Math.min(stageState.widthM, dragStart.xM + dxM));
          let yM = Math.max(0, Math.min(stageState.depthM, dragStart.yM + dyM));
          if (stageState.snap) { xM = snapM(xM); yM = snapM(yM); }
          dragItem.xM = xM; dragItem.yM = yM;
          const tile = surfaceEl.querySelector(`.stage-item[data-id="${dragItem.id}"]`);
          if (tile) {
            tile.style.left = (xM * STAGE_PX_PER_M - 29) + 'px';
            tile.style.top = (yM * STAGE_PX_PER_M - 21) + 'px';
          }
        });

        document.addEventListener('mouseup', () => { dragItem = null; dragStart = null; });

        surfaceEl.addEventListener('input', (e) => {
          if (!e.target.dataset.stageLabel) return;
          const it = stageState.items.find(it => it.id === e.target.dataset.stageLabel);
          if (it) it.label = e.target.value;
        });
      }

      //A function for deleting all items on the stage and setting stage sixe to the default 8x5 meters
      async function deleteAllStageItems() {
        //Set the stage size to 8x5
        stageState.widthM = 8;
        stageState.depthM = 5;

        //Then "refresh" the buttons
        overlay.querySelector('#stageWidthInput').value = stageState.widthM;
        overlay.querySelector('#stageDepthInput').value = stageState.depthM;

        //Clear the array containing the items on the stage
        stageState.items.length = 0;
        renderSurface();
        return;
      }

      function open() {
        ensure();
        if (!overlayEventsBound) { bindItemEvents(); overlayEventsBound = true; }
        overlay.classList.add('open');
        renderSurface();
      }
      function close() { overlay.classList.remove('open'); }

      // Builds a fully self-contained SVG (literal hex colors, no external CSS)
      // and rasterizes it to a PNG for download — works without any external library.
      async function exportPNG() {
        const EXPORT_PX_PER_M = 80;
        const pad = 50;
        const w = stageState.widthM * EXPORT_PX_PER_M;
        const h = stageState.depthM * EXPORT_PX_PER_M;
        const totalW = w + pad * 2;
        const totalH = h + pad * 2 + 60;

        let itemsSvg = '';
        stageState.items.forEach((it) => {
          const cx = pad + it.xM * EXPORT_PX_PER_M;
          const cy = pad + it.yM * EXPORT_PX_PER_M;
          const iconInner = (STAGE_ICONS[it.type] || STAGE_ICONS.performer)
            .replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '');
          itemsSvg += `
            <rect x="${cx - 15}" y="${cy - 15}" width="30" height="30" rx="6" fill="#2b2721" stroke="#3c362d" stroke-width="1.5"/>
            <path d="M${cx - 13.5} ${cy - 13} h27 v4 a2 2 0 0 1 -2 2 h-23 a2 2 0 0 1 -2 -2 Z" fill="#c96b8a"/>
            <g transform="translate(${cx},${cy}) rotate(${it.rot}) translate(-9,-9)" stroke="#c96b8a" fill="none" stroke-width="1.5">${iconInner}</g>
            <text x="${cx}" y="${cy + 30}" text-anchor="middle" font-size="11" font-family="monospace" fill="#ece7dd">${esc(it.label || '')}</text>`;
        });

        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}">
          <rect width="${totalW}" height="${totalH}" fill="#141210"/>
          <rect x="${pad}" y="${pad}" width="${w}" height="${h}" fill="#1c1a17" stroke="#6d685d" stroke-width="1.5" rx="3"/>
          ${itemsSvg}
          <g transform="translate(${pad + w / 2},${pad + h + 26})">
            <path d="M0 -14 L0 4 M-7 -3 L0 4 L7 -3" stroke="#6d685d" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="0" y="22" text-anchor="middle" font-size="10" font-family="monospace" letter-spacing="1" fill="#6d685d">FRONT OF HOUSE / AUDIENCE</text>
          </g>
        </svg>`;

        const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);
        const img = new Image();
        img.onload = () => {
          const canvasEl = document.createElement('canvas');
          canvasEl.width = totalW; canvasEl.height = totalH;
          const ctx = canvasEl.getContext('2d');
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          canvasEl.toBlob((blob) => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = (document.getElementById('setupName').value.trim() || 'stage-plot') + '-stage-plot.png';
            a.click();
          }, 'image/png');
        };
        img.onerror = () => { setStatus('Stage plot export failed.'); URL.revokeObjectURL(url); };
        img.src = url;
      }

      // Dev tool: type StagePlot.debugState() in the browser console
      // (F12 → Console tab) to see the raw list of everything currently
      // placed on the stage — handy for checking positions/labels/rotation
      // without having to click each item one by one.
      return { open, close, debugState: () => stageState };
    })();

    document.getElementById('btn-stageplot').addEventListener('click', async () => {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        await Dialog.alert('Sign in to use Stage Plot.', { kicker: 'ACCOUNT', title: 'Sign-in required' });
        return;
      }
      const isPaid = await checkPremiumStatus(user);
      if (!isPaid) {
        await Dialog.alert('Stage Plot is a premium feature. Taking you to checkout…', { kicker: 'UPGRADE', title: 'Premium required', okText: 'Continue', accent: 'accessory' });
        goToCheckout(user);
        return;
      }
      StagePlot.open();
    });

  </script>

</body>
