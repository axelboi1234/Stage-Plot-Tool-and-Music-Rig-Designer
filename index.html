<!DOCTYPE html>
<html lang="en">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	
<script src="https://app.secureprivacy.ai/script/6a7ae0f3892dbe7b98589ddb.js"></script>

<head>
  <meta charset="UTF-8">
  <title>Setup Schematicizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    /*Colours for everything*/
    :root {
      --bg: #000000;
      --panel: #24211d;
      --panel2: #2b2721;
      --panel3: #221e19;
      --border: #3c362d;
      --border-soft: #302b24;
      --text: #ece7dd;
      --text-dim: #a49d8f;
      --text-faint: #6d685d;
      --instrument: #e8a33d;
      --effect: #d4653a;
      --looper: #3fae9c;
      --accessory: #d9c25a;
      --mixer: #9b7fd1;
      --interface: #5b93c9;
      --daw: #7fbe4f;
      --monitor: #c96b8a;
      --other: #8a8880;
      --midi: #5fc9d9;
      --danger: #c9615f;
      font-family: 'Inter', sans-serif;
    }

    /*Colours for links*/
    a {
      color: var(--instrument);
    }

    * {
      box-sizing: border-box;
    }

    body {
      padding: 0;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button,
    input,
    select {
      font-family: inherit;
      appearance: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /*Topbar*/
    .topbar {
      background-color: var(--panel);
      display: flex;
      flex-direction: column;
      width: 100%;
      padding: 5px;
      box-sizing: border-box;
    }

    .topbar h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0;
    }

    .tb-logo {
      display: flex;
      align-items: baseline;
      padding: 5px 10px;
      padding-right: 6px;

      white-space: nowrap;
    }

    /*Left and right sections of the topbar*/
    .tb-left,
    .tb-right {
      display: flex;
      flex-direction: row;
      align-items: center;
      /*Space between logo, helpBtn, and button groups*/
      gap: 12px;
      flex-wrap: nowrap;
    }

    /*Top and bottom rows of the topbar*/
    .tb-tp-row,
    .tb-btm-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      flex-wrap: nowrap;
      gap: 16px;
    }

    /*Used to group related elements on the topbar (like file btns, or cloud btns)*/
    .tb-group {
      display: flex;
      flex-direction: row;
      align-items: center;
      /* Space between individual buttons */
      gap: 5px;
    }

    .tb-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex: none;

    }

    .tb-status {
      font-size: 12px;
      color: var(--text-faint);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }

    /* Unified topbar button — one consistent style/size for every action in the bar */
    .tb-btn {
      display: inline-flex;
      gap: 6px;
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      padding: 7px 9px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color .15s ease, color .15s ease, background .15s ease, opacity .15s ease;
    }

    .tb-btn:hover {
      color: var(--text);
      border-color: var(--text-faint);
    }

    .tb-btn--primary {
      background: var(--text);
      color: var(--panel);
      border-color: var(--text);
    }

    .tb-btn--primary:hover {
      opacity: .9;
    }

    .tb-btn--danger:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .tb-btn--daw:hover {
      border-color: var(--daw);
      color: var(--daw);
    }

    .tb-btn--premium {
      background-color: var(--accessory);
      border-color: var(--accessory);
      color: var(--panel);
    }

    .tb-btn--premium:hover {
      filter: brightness(1.08);
    }

    .tb-btn--cloud svg {
      color: var(--daw);
    }

    .tb-btn--cloud:hover {
      border-color: var(--daw);
      color: var(--text);
    }

    .name-input {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 4px;
      width: 190px;
    }

    .name-input:focus {
      outline: 1px solid var(--instrument);
    }

    .btn {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--text-faint);
    }

    .btn.primary {
      background: var(--instrument);
      border-color: var(--instrument);
      color: #241a08;
    }

    .btn.primary:hover {
      filter: brightness(1.08);
    }

    .spacer {
      flex-grow: 1;
    }

    .status {
      font-size: 12px;
      color: var(--text-faint);
      font-family: 'JetBrains Mono', monospace;
      min-width: 100px;
      text-align: right;
    }

    /*Zoom controls — floating pill pinned to the canvas corner, not the topbar*/
    .canvas-zoom {
      position: absolute;
      right: 16px;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
      z-index: 4;
    }

    .canvas-zoom button {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
    }

    .canvas-zoom button:hover {
      background: var(--panel3);
    }

    .zoom-level {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
      padding: 0 6px;
      min-width: 42px;
      text-align: center;
    }

    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /*Sidebar*/
    .sidebar {
      width: 216px;
      flex: none;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
      z-index: 9;
    }

    .search-input {
      width: 100%;
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12.5px;
      padding: 7px 9px;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .search-input:focus {
      outline: 1px solid var(--instrument);
    }

    .search-input::placeholder {
      color: var(--text-faint);
    }

    details.cat-group {
      margin-bottom: 4px;
    }

    details.cat-group summary {
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-dim);
      padding: 6px 2px;
      display: flex;
      align-items: center;
      gap: 7px;
      list-style: none;
    }

    details.cat-group summary::-webkit-details-marker {
      display: none;
    }

    details.cat-group summary::before {
      content: '';
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 4px 0 4px 6px;
      border-color: transparent transparent transparent var(--text-dim);
      flex: none;
      display: inline-block;
      transition: transform .20s;
    }

    /*Rotate the little arrow when a dropdown menu is open*/
    details.cat-group[open] summary::before {
      transform: rotate(90deg);
    }

    .swatch {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: none;
      display: inline-block;
    }

    .swatch.midi {
      border-radius: 3px;
    }

    .swatch.control {
      border-radius: 2px;
      transform: rotate(45deg);
    }

    .palette-item {
      display: block;
      width: 100%;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--nc);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 7px 8px;
      border-radius: 4px;
      cursor: grab;
      margin: 0 0 5px 3px;
      text-align: left;
    }

    .palette-item:active {
      cursor: grabbing;
    }

    .palette-item:hover {
      background: #332e26;
      border-left-width: 5px;
    }

    .sidebar .hint {
      font-size: 11px;
      line-height: 1.55;
      color: var(--text-faint);
      margin-top: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border-soft);
    }

    .sidebar .hint b {
      color: var(--text-dim)
    }

    /*Canvas*/
    .canvas-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background: #141210;
      position: relative;
    }

    .canvas-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }

    .canvas-viewport:active {
      cursor: grabbing;
    }

    .canvas {
      position: absolute;
      width: 4000px;
      height: 4000px;
      background-color: var(--bg);
      background-image: radial-gradient(circle, #3a352c 1px, transparent 1px);
      background-size: 22px 22px;
      transform-origin: 0 0;
    }

    /*Cables*/
    svg.cables {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 2;
    }

    svg.cables path.cable-hit {
      stroke: transparent;
      stroke-width: 15;
      fill: none;
      pointer-events: stroke;
      cursor: pointer;
    }

    svg.cables path.cable {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      pointer-events: none;
      transition: stroke-width .12s, filter .12s;
    }

    svg.cables path.cable.selected {
      stroke-width: 5;
    }

    svg.cables path.cable-hit:hover+path.cable {
      stroke-width: 5;
      filter: brightness(1.2);
    }

    svg.cables .cap {
      pointer-events: none;
    }

    svg.cables .cable-tag {
      pointer-events: none;
    }

    .cable-del {
      cursor: pointer;
    }

    .cable-label-input {
      position: absolute;
      z-index: 5;
      width: 140px;
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      padding: 4px 7px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      display: none;
    }

    .cable-label-input:focus {
      outline: 1px solid var(--instrument);
    }

    /*Nodes*/
    .node {
      position: absolute;
      background: linear-gradient(180deg, var(--panel2) 0%, var(--panel3) 100%);
      border: 1px solid var(--border);
      border-radius: 5px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .4);
      z-index: 3;
    }

    .node-bar {
      height: 18px;
      border-radius: 5px 5px 0 0;
      background: var(--nc);
      cursor: grab;
      user-select: none;
      background-image: repeating-linear-gradient(90deg, rgba(0, 0, 0, .18) 0 2px, transparent 2px 6px);
      background-position: center;
      background-repeat: no-repeat;
      background-size: 28px 8px;
    }

    .node-bar:active {
      cursor: grabbing;
    }

    .screw {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 32%, #8a8880, #322e28 72%);
      z-index: 2;
      user-select: none;
    }

    .screw.tl {
      top: 3px;
      left: 3px;
    }

    .screw.tr {
      top: 3px;
      right: 3px;
    }

    .screw.bl {
      bottom: 3px;
      left: 3px;
    }

    .screw.br {
      bottom: 3px;
      right: 3px;
    }

    .node-del {
      position: absolute;
      top: 20px;
      right: 9px;
      width: 16px;
      height: 16px;
      border: none;
      background: transparent;
      color: var(--text-faint);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      border-radius: 3px;
      padding: 0;
    }

    .node-del:hover {
      color: var(--danger);
      background: rgba(255, 255, 255, .06);
    }

    .node-body {
      padding: 7px 12px 8px;
    }

    .node-top {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 5px;
    }

    .node-icon {
      flex: none;
      width: 24px;
      height: 24px;
      color: var(--nc);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .node-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .cat-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--nc);
      margin: 0 0 2px;
    }

    .node-label {
      display: block;
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      padding: 0;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-label:focus {
      outline: none;
      border-bottom: 1px solid var(--text-faint);
    }

    .node-label.static {
      cursor: default;
    }

    .node-sub {
      display: block;
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      padding: 0;
    }

    .node-sub:focus {
      outline: none;
      border-bottom: 1px solid var(--text-faint);
    }

    .node-sub::placeholder {
      color: var(--text-faint);
    }


    .io-controls {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border-soft);
    }

    .io-controls.stacked {
      flex-direction: column;
      gap: 4px;
    }

    .io-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      color: var(--text-faint);
      user-select: none;
    }

    .io-row b {
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      min-width: 14px;
      text-align: center;
    }

    .io-row button {
      width: 15px;
      height: 15px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text-dim);
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      line-height: 1;
      padding: 0;
      flex: none;
    }

    .io-row button:hover {
      border-color: var(--text-faint);
      color: var(--text);
    }

    .type-pick {
      width: 58px;
      height: 16px;
      font-size: 9px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 3px;
      padding: 0 2px;
      margin-left: auto;
    }

    /*Routing*/
    .routing {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border-soft);
    }

    .routing-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-faint);
      margin-bottom: 4px;
    }

    .routing-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 3px;
    }

    .routing-row-out {
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
    }

    .routing-row-top {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .routing-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8.5px;
      color: var(--text-faint);
      width: 64px;
      flex: none;
    }

    .routing-row input {
      flex: 1;
      min-width: 0;
      background: var(--panel3);
      border: 1px solid var(--border-soft);
      border-radius: 3px;
      color: var(--text);
      font-size: 10.5px;
      padding: 2px 5px;
    }

    .routing-row input:focus {
      outline: 1px solid var(--daw);
    }

    .routing-source {
      width: 100%;
      background: var(--panel3);
      border: 1px solid var(--border-soft);
      border-radius: 3px;
      color: var(--text-dim);
      font-size: 9px;
      padding: 2px 4px;
    }

    /*Ports*/
    .port {
      position: absolute;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      transform: translateY(-50%);
      background: radial-gradient(circle at 35% 30%, #6b665d, #17140f 78%);
      border: 2px solid var(--nc);
      box-shadow: inset 0 0 0 2px #100d09, 0 1px 2px rgba(0, 0, 0, .5);
      cursor: crosshair;
      z-index: 3;
    }

    .port.in {
      left: -8px;
    }

    .port.out {
      right: -8px;
    }

    .port.midi {
      border-radius: 4px;
      border-color: var(--midi);
    }

    .port.control {
      border-radius: 2px;
      border-color: var(--accessory);
      transform: translateY(-50%) rotate(45deg);
    }

    .port-label {
      position: absolute;
      transform: translateY(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--text-faint);
      background: transparent;
      border: none;
      width: 58px;
      padding: 0;
    }

    .port-label.in {
      left: 11px;
      text-align: left;
    }

    .port-label.out {
      right: 11px;
      text-align: right;
    }

    .port-label:focus {
      color: var(--text);
      outline: none;
      border-bottom: 1px solid var(--text-faint);
    }

    .port-label::placeholder {
      color: var(--text-faint);
      opacity: .6;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 9px 14px;
      padding: 8px 16px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      flex: none;
      z-index: 10;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* === Custom dialog system (replaces browser alert/confirm/prompt) === */
    .dlg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .62);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease;
    }

    .dlg-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .dlg-box {
      width: 360px;
      max-width: calc(100vw - 40px);
      background: linear-gradient(180deg, var(--panel2) 0%, var(--panel3) 100%);
      border: 1px solid var(--border);
      border-radius: 7px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .55);
      transform: translateY(6px) scale(.98);
      transition: transform .15s ease, width .15s ease;
      overflow: hidden;
    }

    .dlg-box.wide {
      width: 460px;
    }

    .dlg-overlay.open .dlg-box {
      transform: translateY(0) scale(1);
    }

    .dlg-bar {
      height: 6px;
      background: var(--dlg-accent, var(--instrument));
    }

    .dlg-body {
      padding: 18px 20px 16px;
    }

    .dlg-kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--dlg-accent, var(--instrument));
      margin-bottom: 6px;
    }

    .dlg-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .dlg-message {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-dim);
    }

    .dlg-message p {
      margin: 0 0 10px;
    }

    .dlg-message p:last-child {
      margin-bottom: 0;
    }

    .dlg-message ul {
      margin: 0 0 10px;
      padding-left: 18px;
    }

    .dlg-message li {
      margin-bottom: 4px;
    }

    .dlg-message b,
    .dlg-message strong {
      color: var(--text);
    }

    .dlg-message a {
      color: var(--dlg-accent, var(--instrument));
    }

    .dlg-fields {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dlg-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .dlg-field span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .dlg-field input {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 4px;
      font-family: 'Inter', sans-serif;
    }

    .dlg-field input:focus {
      outline: 1px solid var(--dlg-accent, var(--instrument));
      border-color: transparent;
    }

    .dlg-field-row {
      display: flex;
      gap: 6px;
    }

    .dlg-field-row input {
      flex: 1;
      min-width: 0;
    }

    .dlg-field-row .btn {
      flex: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
    }

    .rig-public-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      letter-spacing: .04em;
      color: var(--looper);
      margin-left: 6px;
    }

    .dlg-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .btn.danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn.danger:hover {
      background: var(--danger);
      color: #2a0d0d;
    }

    /* === Cloud rig manager (Load from Cloud) === */
    /* Sits below .dlg-overlay's z-index so a Dialog.confirm (e.g. delete/overwrite)
       opened from within the rig list always renders on top, regardless of DOM order. */
    .rig-overlay {
      z-index: 490;
    }

    .rig-box {
      width: 440px;
    }

    .rig-list {
      margin-top: 14px;
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rig-empty {
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text-faint);
      padding: 20px 4px;
      text-align: center;
    }

    .rig-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: 5px;
      padding: 8px 10px;
    }

    .rig-item-info {
      min-width: 0;
    }

    .rig-item-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rig-item-meta {
      font-size: 10.5px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-faint);
      margin-top: 2px;
    }

    .rig-item-actions {
      display: flex;
      gap: 6px;
      flex: none;
    }

    .rig-item-actions .btn {
      padding: 5px 10px;
      font-size: 12px;
    }

    .rig-owner-note {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-faint);
      padding: 5px 2px;
    }

    /* === Share settings modal (public link + per-person access) === */
    .share-overlay {
      z-index: 495;
    }

    .share-section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 7px;
    }

    #share-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .share-people {
      margin-top: 10px;
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .share-person {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: 5px;
      padding: 7px 10px;
      font-size: 12.5px;
      color: var(--text-dim);
    }

    .share-person button {
      flex: none;
      width: 22px;
      height: 22px;
      padding: 0;
      font-size: 13px;
      line-height: 1;
    }

    /* Stage Plot */
    .tb-btn--stage svg {
      color: var(--monitor);
    }

    .tb-btn--stage:hover {
      border-color: var(--monitor);
      color: var(--text);
    }

    .stage-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .66);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease;
    }

    .stage-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .stage-modal {
      width: 92vw;
      height: 88vh;
      max-width: 1200px;
      background: linear-gradient(180deg, var(--panel2) 0%, var(--panel3) 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(8px) scale(.98);
      transition: transform .15s ease;
    }

    .stage-overlay.open .stage-modal {
      transform: translateY(0) scale(1);
    }

    .stage-topbar {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      padding: 5px 5px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex: none;
    }

    .stage-topbar h2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .03em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0;
      padding: 10px;
    }

    .stage-topbar .tb-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stage-dim-input {
      width: 40px;
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 5px 5px;
      border-radius: 4px;
      text-align: center;
    }

    .stage-dim-input:focus {
      outline: 1px solid var(--monitor);
    }

    .stage-dim-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-faint);
      padding-left: 10px;
    }

    .stage-dim-x {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-faint);
    }

    .stage-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      background: var(--panel2);
      border: 1px solid var(--border);
      padding: 6px 10px 6px 8px;
      border-radius: 5px;
      transition: background .12s ease, border-color .12s ease, color .12s ease;
    }

    .stage-toggle:hover {
      border-color: var(--text-faint);
    }

    /* Clear on/off indicator: empty outlined square when off, filled square
       with a checkmark when on — square to match the rest of the module UI. */
    .stage-toggle-box {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1.5px solid var(--text-faint);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      transition: background .12s ease, border-color .12s ease;
    }

    .stage-toggle-box svg {
      width: 9px;
      height: 9px;
      display: block;
      opacity: 0;
      transition: opacity .12s ease;
    }

    .stage-toggle[data-active="true"] {
      background: var(--monitor);
      border-color: var(--monitor);
      color: #241a08;
    }

    .stage-toggle[data-active="true"] .stage-toggle-box {
      background: #241a08;
      border-color: #241a08;
    }

    .stage-toggle[data-active="true"] .stage-toggle-box svg {
      opacity: 1;
    }

    .stage-close {
      margin-left: auto;
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      flex: none;
    }

    .stage-close:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .stage-body {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* Sidebar — a compact icon grid rather than a long list of text rows */
    .stage-sidebar {
      width: 176px;
      flex: none;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
    }

    .stage-sidebar .search-input {
      margin-bottom: 10px;
    }

    .stage-palette-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stage-palette-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-top: 3px solid var(--monitor);
      border-radius: 6px;
      padding: 8px 4px 10px;
      cursor: grab;
      text-align: center;
    }

    .stage-palette-item:active {
      cursor: grabbing;
    }

    .stage-palette-item:hover {
      background: #332e26;
      border-color: var(--monitor);
    }

    .stage-palette-item svg {
      width: 20px;
      height: 20px;
      flex: none;
      color: var(--monitor);
    }

    .stage-palette-item span {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-dim);
      line-height: 1.25;
    }

    .stage-sidebar .hint {
      font-size: 11px;
      line-height: 1.55;
      color: var(--text-faint);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-soft);
    }

    .stage-canvas-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #141210;
    }

    .stage-canvas-wrap {
      flex: 1;
      overflow: auto;
      position: relative;
      text-align: center;
    }

    .stage-surface-outer {
      display: inline-block;
      margin: 48px auto 74px;
      position: relative;
    }

    .stage-surface {
      position: relative;
      background-color: #1c1a17;
      background-image: linear-gradient(#2c2820 1px, transparent 1px), linear-gradient(90deg, #2c2820 1px, transparent 1px);
      background-size: 0 0;
      border: 1px solid var(--border-soft);
      border-radius: 3px;
    }

    .stage-foh {
      position: absolute;
      left: 50%;
      bottom: -42px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      pointer-events: none;
      white-space: nowrap;
    }

    .stage-foh svg {
      color: var(--text-faint);
      width: 18px;
      height: 18px;
    }

    .stage-foh span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      letter-spacing: .08em;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    .stage-item {
      position: absolute;
      width: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: grab;
      user-select: none;
      z-index: 2;
    }

    .stage-item:active {
      cursor: grabbing;
      z-index: 3;
    }

    /* Outer square stays fixed — only its inner contents rotate — so the
       delete/rotate buttons never spin out of reach or upside-down.
       Styled like the signal-chain node modules: rounded-square panel
       with a colored accent strip, not a circular badge. */
    .stage-item-icon {
      width: 42px;
      height: 42px;
      border-radius: 7px;
      background: linear-gradient(180deg, var(--panel2) 0%, var(--panel3) 100%);
      border: 1px solid var(--border);
      position: relative;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .4);
      flex: none;
    }

    .stage-item-icon::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--monitor);
      border-radius: 6px 6px 0 0;
    }

    .stage-item-icon-inner {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--monitor);
      transition: transform .12s ease;
    }

    .stage-item-icon-inner svg {
      width: 22px;
      height: 22px;
    }

    .stage-item-del {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--danger);
      color: #2a0d0d;
      border: none;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .stage-item:hover .stage-item-del {
      display: flex;
    }

    .stage-item-rotate {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--panel3);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 9px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .stage-item:hover .stage-item-rotate {
      display: flex;
    }

    .stage-item-label {
      max-width: 74px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 10.5px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      cursor: text;
    }

    .stage-item-label:focus {
      outline: none;
      border-bottom: 1px solid var(--text-faint);
    }
  </style>
</head>

  <script>
    //=================================================================
    // TABLE OF CONTENTS
    // Every major
    // section in this file starts with a comment like
    // "// === SECTION NAME ===" or "function someName(" — those are
    // exactly what's listed here.
    // ================================================================
    //
    //  WANT TO...                              SEARCH FOR THIS
    //  ---------------------------------------------------------------
    //  Show a popup (alert/confirm/form)    -> "const Dialog = "
    //  Change the first-time welcome popup  -> "First-visit welcome popup"
    //  Add/edit a gear CATEGORY             -> "const CATS = {"
    //  Add/edit a piece of GEAR             -> "const GEAR = ["
    //  Change what an icon looks like       -> "const ICON_SHAPES = {"
    //  How a gear item gets placed down     -> "function addNode("
    //  How gear modules get drawn on screen -> "function renderNodes()"
    //  Zoom / pan behavior                  -> "Viewport Zoom & Pan"
    //  Sidebar drag-and-drop                -> "Sidebar palette"
    //  The "New"/Clear-canvas button        -> "New Workspace"
    //  Import/export a setup as a JSON file -> "JSON Import / Export"
    //  What loads when the page first opens -> "Initial Starter Rig"
    //  Loading an old save back in          -> "function applyImportedState("
    //  Premium / "Go Premium" button logic  -> "function checkPremiumStatus("
    //  Sending someone to Stripe checkout   -> "function goToCheckout("
    //  "Load from Cloud" popup              -> "Cloud rig manager modal"
    //  The "Share" popup (link + people)    -> "Share settings modal"
    //  Opening a rig someone shared w/ you  -> "Load a shared rig"
    //  Returning from Stripe after payment  -> "Returning from Stripe"
    //  Stage Plot: the gear list            -> "const STAGE_GEAR = ["
    //  Stage Plot: everything else          -> "const StagePlot = "
    //
    // ================================================================

    // === Custom dialog system (replaces browser alert/confirm/prompt) ===
    // Dialog.alert(message, opts) -> Promise<void>
    // Dialog.confirm(message, opts) -> Promise<boolean>
    // Dialog.form(fields, opts)    -> Promise<{[key]: string} | null>
    const Dialog = (() => {
      let overlay, box, resolver;

      function ensure() {
        if (overlay) return;
        overlay = document.createElement('div');
        overlay.className = 'dlg-overlay';
        overlay.innerHTML = `
          <div class="dlg-box" role="dialog" aria-modal="true">
            <div class="dlg-bar"></div>
            <div class="dlg-body">
              <div class="dlg-kicker"></div>
              <div class="dlg-title"></div>
              <div class="dlg-message"></div>
              <div class="dlg-fields"></div>
              <div class="dlg-actions"></div>
            </div>
          </div>`;
        document.body.appendChild(overlay);
        box = overlay.querySelector('.dlg-box');

        overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(null); });
        document.addEventListener('keydown', (e) => {
          if (!overlay.classList.contains('open')) return;
          if (e.key === 'Escape') close(null);
          if (e.key === 'Enter') {
            const okBtn = box.querySelector('[data-dlg-ok]');
            if (okBtn) okBtn.click();
          }
        });
      }

      function close(value) {
        overlay.classList.remove('open');
        if (resolver) { resolver(value); resolver = null; }
      }

      function open({ kicker = '', title = '', message = '', html = '', fields = [], okText = 'OK', cancelText = 'Cancel', showCancel = false, accent = 'instrument', wide = false }) {
        ensure();
        box.style.setProperty('--dlg-accent', `var(--${accent})`);
        box.classList.toggle('wide', !!wide);

        const kickerEl = box.querySelector('.dlg-kicker');
        kickerEl.textContent = kicker;
        kickerEl.style.display = kicker ? '' : 'none';

        const titleEl = box.querySelector('.dlg-title');
        titleEl.textContent = title;
        titleEl.style.display = title ? '' : 'none';

        const msgEl = box.querySelector('.dlg-message');
        if (html) {
          msgEl.innerHTML = html;
          msgEl.style.display = '';
        } else {
          msgEl.textContent = message;
          msgEl.style.display = message ? '' : 'none';
        }

        const fieldsEl = box.querySelector('.dlg-fields');
        fieldsEl.innerHTML = fields.map(f => `
            <label class="dlg-field">
              <span>${f.label}</span>
              <div class="dlg-field-row">
                <input type="${f.type || 'text'}" data-dlg-field="${f.key}" placeholder="${f.placeholder || ''}"
                  value="${(f.value || '').replace(/"/g, '&quot;')}" ${f.readonly ? 'readonly' : ''}
                  autocomplete="${f.autocomplete || 'off'}">
                ${f.copyable ? `<button type="button" class="btn" data-dlg-copy="${f.key}">Copy</button>` : ''}
              </div>
            </label>`).join('');
        fieldsEl.style.display = fields.length ? '' : 'none';
        fieldsEl.querySelectorAll('[data-dlg-copy]').forEach(btn => {
          btn.addEventListener('click', () => {
            const input = fieldsEl.querySelector(`[data-dlg-field="${btn.dataset.dlgCopy}"]`);
            input.select();
            const done = () => { const orig = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = orig; }, 1400); };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(input.value).then(done).catch(() => { document.execCommand('copy'); done(); });
            } else {
              document.execCommand('copy'); done();
            }
          });
        });

        const actionsEl = box.querySelector('.dlg-actions');
        actionsEl.innerHTML = (showCancel ? `<button class="btn" data-dlg-cancel>${cancelText}</button>` : '') +
          `<button class="btn primary" data-dlg-ok>${okText}</button>`;

        overlay.classList.add('open');
        const firstInput = fieldsEl.querySelector('input');
        setTimeout(() => (firstInput || actionsEl.querySelector('[data-dlg-ok]')).focus(), 30);

        return new Promise(resolve => {
          resolver = resolve;
          actionsEl.querySelector('[data-dlg-ok]').onclick = () => {
            if (fields.length) {
              const out = {};
              fields.forEach(f => { out[f.key] = fieldsEl.querySelector(`[data-dlg-field="${f.key}"]`).value; });
              close(out);
            } else {
              close(true);
            }
          };
          const cancelBtn = actionsEl.querySelector('[data-dlg-cancel]');
          if (cancelBtn) cancelBtn.onclick = () => close(fields.length ? null : false);
        });
      }

      return {
        alert(message, opts = {}) {
          return open({ kicker: opts.kicker ?? 'NOTICE', title: opts.title || '', message, okText: opts.okText || 'OK', accent: opts.accent || 'instrument' });
        },
        confirm(message, opts = {}) {
          return open({ kicker: opts.kicker ?? 'CONFIRM', title: opts.title || '', message, okText: opts.okText || 'Confirm', cancelText: opts.cancelText || 'Cancel', showCancel: true, accent: opts.accent || 'danger' });
        },
        form(fields, opts = {}) {
          return open({ kicker: opts.kicker || '', title: opts.title || '', message: opts.message || '', fields, okText: opts.okText || 'Submit', cancelText: opts.cancelText || 'Cancel', showCancel: true, accent: opts.accent || 'instrument' });
        },

        //Welcome popup
        welcome(opts = {}) {
          return open({ kicker: opts.kicker ?? 'WELCOME', title: opts.title || '', html: opts.html || '', okText: opts.okText || 'Got it', accent: opts.accent || 'instrument', wide: true });
        },
        //Help popup
        help(opts = {}) {
          return open({ kicker: opts.kicker ?? 'Help', title: opts.title || '', html: opts.html || '', okText: opts.okText || 'Got it', accent: opts.accent || 'daw', wide: true });
        },

        shareLink(url, opts = {}) {
          return open({
            kicker: opts.kicker ?? 'SHARE',
            title: opts.title || 'Share this setup',
            html: opts.html || '<p>Anyone with this link can open a read-only copy of this setup — no account needed.</p>',
            fields: [{ key: 'url', label: 'Shareable link', value: url, readonly: true, copyable: true }],

      return (arr || []).map(p => {
        const port = { label: p[0], type: normType(p[1]) };
        if (isOutput) port.source = null;
        return port;
      });
    }

    function nodeRows(n) { return Math.max(1, n.inPorts.length, n.outPorts.length); }

      let h = 66;
      if (n.adjustable) h += 28;
      if (n.cat === 'other') h += 24;
      if (n.cat === 'daw') { h += 16 + n.inPorts.length * 20 + n.outPorts.length * 36; }
      return h;
    }
    function nodeHeightOf(n) { return headerHeightOf(n) + nodeRows(n) * ROW_H + FOOTER_PAD; }

      canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;

    }

      const col = i % 5, row = Math.floor(i / 5);

        id, cat: gearDef.cat, label: gearDef.label, sub: '', x: pos.x, y: pos.y,

        adjustable,
        nextInType: 'audio', nextOutType: 'audio'
      });
      return id;

      const n = state.nodes.find(n => n.id === nodeId); if (!n) return;
      if (!n.adjustable) return;
      const arr = io === 'in' ? n.inPorts : n.outPorts;
      if (delta > 0) {
        if (arr.length >= 24) return;
        let type = 'audio';
        if (n.cat === 'other') { type = (io === 'in' ? n.nextInType : n.nextOutType) || 'audio'; }
        const label = type === 'midi' ? 'MIDI' : (type === 'control' ? 'CTL' : '');
        const port = { label, type };
        if (io === 'out') port.source = null;
        arr.push(port);
      } else {
        if (arr.length <= 0) return;
        const removedIdx = arr.length - 1;
        arr.pop();
        if (io === 'in') { n.outPorts.forEach(p => { if (p.source === removedIdx) p.source = null; }); }
        state.connections = state.connections.filter(c => {
          if (io === 'in') return !(c.to === nodeId && c.toIdx === removedIdx);
          return !(c.from === nodeId && c.fromIdx === removedIdx);
        });
      }
      render();
    }

    function getPortPos(nodeId, kind, idx) {
      const n = state.nodes.find(n => n.id === nodeId);
      if (!n) return { x: 0, y: 0 };
      return { x: kind === 'out' ? n.x + NODE_W : n.x, y: n.y + headerHeightOf(n) + ROW_H * (idx + 0.5) };
    }
    function getPortType(nodeId, kind, idx) {
      const n = state.nodes.find(n => n.id === nodeId); if (!n) return 'audio';
      const arr = kind === 'out' ? n.outPorts : n.inPorts;
      return (arr[idx] && arr[idx].type) || 'audio';
    }
    function describeDawInput(n, idx) {
      const p = n.inPorts[idx];
      let base = 'In ' + (idx + 1) + (p && p.label ? ': ' + p.label : '');
      const conn = state.connections.find(c => c.to === n.id && c.toIdx === idx);
      if (conn) {
        const src = state.nodes.find(s => s.id === conn.from);
        if (src) {
          const sp = src.outPorts[conn.fromIdx];
          const spLabel = sp && sp.label ? sp.label : ('out ' + (conn.fromIdx + 1));
          base += ' ← ' + src.label + ' (' + spLabel + ')';
        }
      }
      return base;
    }

    function portRowsHtml(n) {
      const skipLabels = n.cat === 'daw';
      const hOffset = headerHeightOf(n);
      let html = '';
      n.inPorts.forEach((p, i) => {
        const y = hOffset + ROW_H * (i + 0.5);
        const cls = p.type === 'midi' ? ' midi' : (p.type === 'control' ? ' control' : '');
        html += `<div class="port in${cls}" data-port-in="${n.id}" data-in-idx="${i}" style = "top:${y}px" ></div > `;
        if (!skipLabels) html += `<input class="port-label in" data-portlabel-in="${n.id}" data-portlabel-idx="${i}" value = "${esc(p.label)}" style = "top:${y}px" placeholder = "${p.type === 'midi' ? 'MIDI' : (p.type === 'control' ? 'CTL' : '')}" spellcheck = "false"> `;
      });
      n.outPorts.forEach((p, i) => {
        const y = hOffset + ROW_H * (i + 0.5);
        const cls = p.type === 'midi' ? ' midi' : (p.type === 'control' ? ' control' : '');
        html += `<div class="port out${cls}" data-port-out="${n.id}" data-out-idx="${i}" style = "top:${y}px" ></div > `;
        if (!skipLabels) html += `<input class="port-label out" data-portlabel-out="${n.id}" data-portlabel-idx="${i}" value = "${esc(p.label)}" style = "top:${y}px" placeholder = "${p.type === 'midi' ? 'MIDI' : (p.type === 'control' ? 'CTL' : '')}" spellcheck = "false"> `;
      });
      return html;
    }

    function renderNodes() {
      canvas.querySelectorAll('.node').forEach(el => el.remove());
      state.nodes.forEach(n => {
        const h = nodeHeightOf(n);
        const adjustable = n.adjustable;

        const showTypePick = n.cat === 'other';
        const nameEditable = NAME_EDITABLE_CATS.includes(n.cat);
        const isDaw = n.cat === 'daw';

        const nameHtml = nameEditable
          ? `<input class="node-label" data-label="${n.id}" value = "${esc(n.label)}" title = "${esc(n.label)}" spellcheck = "false">`
          : `<div class="node-label static" title = "${esc(n.label)}" > ${esc(n.label)}</div>`;

        let ioHtml = '';
        if (adjustable && showTypePick) {
          const inSel = { audio: n.nextInType !== 'midi' && n.nextInType !== 'control', midi: n.nextInType === 'midi', control: n.nextInType === 'control' };
          const outSel = { audio: n.nextOutType !== 'midi' && n.nextOutType !== 'control', midi: n.nextOutType === 'midi', control: n.nextOutType === 'control' };
          ioHtml = `<div class="io-controls stacked">
          <div class="io-row"><span>IN</span>
            <button data-step-id="${n.id}" data-step-io="in" data-step-delta="-1">−</button>
            <b>${n.inPorts.length}</b>
            <button data-step-id="${n.id}" data-step-io="in" data-step-delta="1">+</button>
            <select class="type-pick" data-typepick-id="${n.id}" data-typepick-io="in">
              <option value="audio"${inSel.audio ? ' selected' : ''}>Audio</option>
              <option value="midi"${inSel.midi ? ' selected' : ''}>MIDI</option>
              <option value="control"${inSel.control ? ' selected' : ''}>Ctl</option>
            </select>
          </div>
          <div class="io-row"><span>OUT</span>
            <button data-step-id="${n.id}" data-step-io="out" data-step-delta="-1">−</button>
            <b>${n.outPorts.length}</b>
            <button data-step-id="${n.id}" data-step-io="out" data-step-delta="1">+</button>
            <select class="type-pick" data-typepick-id="${n.id}" data-typepick-io="out">
              <option value="audio"${outSel.audio ? ' selected' : ''}>Audio</option>
              <option value="midi"${outSel.midi ? ' selected' : ''}>MIDI</option>
              <option value="control"${outSel.control ? ' selected' : ''}>Ctl</option>
            </select>
          </div>
        </div > `;
        } else if (adjustable) {
          ioHtml = `<div class="io-controls">
          <div class="io-row"><span>IN</span>
            <button data-step-id="${n.id}" data-step-io="in" data-step-delta="-1">−</button>
            <b>${n.inPorts.length}</b>
            <button data-step-id="${n.id}" data-step-io="in" data-step-delta="1">+</button>
          </div>
          <div class="io-row"><span>OUT</span>
            <button data-step-id="${n.id}" data-step-io="out" data-step-delta="-1">−</button>
            <b>${n.outPorts.length}</b>
            <button data-step-id="${n.id}" data-step-io="out" data-step-delta="1">+</button>
          </div>
        </div > `;
        }

        const routingHtml = isDaw ? `<div class="routing">
      <div class="routing-title">Internal Routing Matrix</div>
        ${n.inPorts.map((p, i) => `<div class="routing-row"><span class="routing-tag">IN ${i + 1}</span><input data-portlabel-in="${n.id}" data-portlabel-idx="${i}" value="${esc(p.label)}" placeholder="label" spellcheck="false"></div>`).join('')}
        ${n.outPorts.map((p, i) => `<div class="routing-row routing-row-out">
            <div class="routing-row-top"><span class="routing-tag">OUT ${i + 1}</span><input data-portlabel-out="${n.id}" data-portlabel-idx="${i}" value="${esc(p.label)}" placeholder="label" spellcheck="false"></div>
            <select class="routing-source" data-route-id="${n.id}" data-route-idx="${i}">
              <option value=""${p.source == null ? ' selected' : ''}>— source: disconnected —</option>
              ${n.inPorts.map((ip, j) => `<option value="${j}"${p.source === j ? ' selected' : ''}>${esc(describeDawInput(n, j))}</option>`).join('')}
            </select>
          </div>`).join('')
          }
      </div > ` : '';

        const el = document.createElement('div');
        el.className = 'node';
        el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
        el.style.width = NODE_W + 'px'; el.style.height = h + 'px';
        el.style.setProperty('--nc', `var(--${n.cat})`);
        el.dataset.id = n.id;
        el.innerHTML = `
      <div class="node-bar" data-drag="${n.id}" ></div>
      <div class="screw tl"></div><div class="screw tr"></div><div class="screw bl"></div><div class="screw br"></div>
      <button class="node-del" data-del="${n.id}">×</button>
      <div class="node-body">
        <div class="node-top">
          <div class="node-icon">${iconSvg(n)}</div>
          <div class="node-titles">
            <div class="cat-tag">${esc(CATS[n.cat].label)}</div>
            ${nameHtml}
          </div>
        </div>
        <input class="node-sub" data-sub="${n.id}" value="${esc(n.sub)}" placeholder="notes" spellcheck="false">
        ${ioHtml}
        ${routingHtml}
      </div>
      ${portRowsHtml(n)}
    `;
        canvas.appendChild(el);
      });
    }

    function cableColorVar(conn) {
      const t = getPortType(conn.from, 'out', conn.fromIdx);
      if (t === 'midi') return 'midi';
      if (t === 'control') return 'accessory';
      const src = state.nodes.find(n => n.id === conn.from);
      return src ? src.cat : 'other';
    }
    function cableD(p1, p2) {
      const dx = Math.max(46, Math.abs(p2.x - p1.x) * 0.5);
      return `M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y} `;
    }
    function cableMid(p1, p2) { return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }; }

    function renderCables() {
      let html = '';
      state.connections.forEach(c => {
        const p1 = getPortPos(c.from, 'out', c.fromIdx), p2 = getPortPos(c.to, 'in', c.toIdx);
        const d = cableD(p1, p2), cv = cableColorVar(c), sel = c.id === selectedCableId;
        html += `<path class="cable-hit" data-cable="${c.id}" d = "${d}" /> `;
        html += `<path class="cable${sel ? ' selected' : ''}" data-cable="${c.id}" d = "${d}" style = "stroke:var(--${cv})"/> `;
        html += `<circle class="cap" cx = "${p1.x}" cy = "${p1.y}" r = "4.5" style = "fill:var(--${cv})" stroke = "#1c1a17" stroke-width="1"/> `;
        html += `<circle class="cap" cx = "${p2.x}" cy = "${p2.y}" r = "4.5" style = "fill:var(--${cv})" stroke = "#1c1a17" stroke-width="1"/> `;
        if (c.label) {
          const mid = cableMid(p1, p2);
          const w = Math.max(26, c.label.length * 5.8 + 12);
          html += `<g class="cable-tag" transform = "translate(${mid.x - w / 2},${mid.y - 9})" ><rect width="${w}" height="16" rx="8" style="fill:var(--panel);stroke:var(--${cv})" stroke-width="1"/><text x="${w / 2}" y="11.5" text-anchor="middle" font-size="9.5" font-family="'JetBrains Mono',monospace" style="fill:var(--${cv})">${esc(c.label)}</text></g> `;
        }
      });
      svg.innerHTML = html;

      const sel = state.connections.find(c => c.id === selectedCableId);
      if (sel) {
        const p1 = getPortPos(sel.from, 'out', sel.fromIdx), p2 = getPortPos(sel.to, 'in', sel.toIdx);
        const mid = cableMid(p1, p2);
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'cable-del'); g.style.pointerEvents = 'auto';
        g.innerHTML = `<circle cx = "${mid.x + 16}" cy = "${mid.y - 16}" r = "9" fill = "#c9615f" stroke = "#1c1a17" stroke-width="1.3" /> <text x="${mid.x + 16}" y="${mid.y - 12.5}" text-anchor="middle" font-size="11" fill="#1c1a17" font-family="Inter, sans-serif">×</text>`;
        g.addEventListener('mousedown', (e) => { e.stopPropagation(); deleteConnection(selectedCableId); });
        svg.appendChild(g);
        showCableLabelInput(sel, mid);
      } else {
        hideCableLabelInput();
      }
    }

    function render() { renderNodes(); renderCables(); updateTransform(); }

    function deleteConnection(id) {
      state.connections = state.connections.filter(c => c.id !== id);
      selectedCableId = null;
      renderCables();
    }

    function showCableLabelInput(conn, mid) {
      cableLabelInput.style.display = 'block';
      cableLabelInput.style.left = (mid.x - 70) + 'px';
      cableLabelInput.style.top = (mid.y + 14) + 'px';
      if (document.activeElement !== cableLabelInput) cableLabelInput.value = conn.label || '';
      cableLabelInput.dataset.forCable = conn.id;
    }
    function hideCableLabelInput() {
      if (document.activeElement === cableLabelInput) return;
      cableLabelInput.style.display = 'none';
      delete cableLabelInput.dataset.forCable;
    }
    cableLabelInput.addEventListener('input', () => {
      const id = cableLabelInput.dataset.forCable;
      const c = state.connections.find(c => c.id === id);
      if (c) { c.label = cableLabelInput.value; renderCables(); }
    });

    function tryCompleteConnection(target) {
      if (!pendingConn) return;
      const portEl = target.closest ? target.closest('[data-port-in],[data-port-out]') : null;
      if (!portEl) { return; }
      const isIn = portEl.hasAttribute('data-port-in');
      const tNode = isIn ? portEl.dataset.portIn : portEl.dataset.portOut;
      const tIdx = parseInt(isIn ? portEl.dataset.inIdx : portEl.dataset.outIdx, 10);
      const tKind = isIn ? 'in' : 'out';
      if (tKind === pendingConn.kind) return;
      if (tNode === pendingConn.node && tIdx === pendingConn.idx) return;

      let from, fromIdx, to, toIdx;
      if (pendingConn.kind === 'out') { from = pendingConn.node; fromIdx = pendingConn.idx; to = tNode; toIdx = tIdx; }
      else { from = tNode; fromIdx = tIdx; to = pendingConn.node; toIdx = pendingConn.idx; }

      const st = getPortType(from, 'out', fromIdx), dt = getPortType(to, 'in', toIdx);
      if (st !== dt) { setStatus("Can't connect " + st + " to " + dt); return; }

      state.connections = state.connections.filter(c => !(c.to === to && c.toIdx === toIdx));
      state.connections.push({ id: 'c' + (idCounter++), from, fromIdx, to, toIdx, label: '' });
    }

    // Global Key tracking for Space panning
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
        spacePressed = true;
        if (!isPanning) viewport.style.cursor = 'grab';
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        spacePressed = false;
        if (!isPanning) viewport.style.cursor = '';
      }
    });

    // Navigation Pointer Controls (Panning / Dragging)
    viewport.addEventListener('mousedown', (e) => {
      const isMiddleClick = e.button === 1;
      if (spacePressed || isMiddleClick) {
        isPanning = true;
        panStart = { x: e.clientX - panX, y: e.clientY - panY };
        viewport.style.cursor = 'grabbing';
        e.preventDefault();
        return;
      }

      const stepBtn = e.target.closest('[data-step-id]');
      if (stepBtn) { stepCount(stepBtn.dataset.stepId, stepBtn.dataset.stepIo, parseInt(stepBtn.dataset.stepDelta, 10)); e.preventDefault(); return; }

      const delBtn = e.target.closest('[data-del]');
      if (delBtn) { deleteNode(delBtn.dataset.del); return; }

      const bar = e.target.closest('[data-drag]');
      if (bar) {
        const id = bar.dataset.drag;
        const n = state.nodes.find(n => n.id === id);
        dragNode = n;
        dragOffset = {
          x: (e.clientX / zoom) - n.x,
          y: (e.clientY / zoom) - n.y
        };
        e.preventDefault(); return;
      }

      const portIn = e.target.closest('[data-port-in]');
      if (portIn) { pendingConn = { node: portIn.dataset.portIn, idx: parseInt(portIn.dataset.inIdx, 10), kind: 'in' }; e.preventDefault(); return; }

      const portOut = e.target.closest('[data-port-out]');
      if (portOut) { pendingConn = { node: portOut.dataset.portOut, idx: parseInt(portOut.dataset.outIdx, 10), kind: 'out' }; e.preventDefault(); return; }

      if (!e.target.closest('.cable-del') && !e.target.closest('[data-cable]') && e.target !== cableLabelInput) {
        selectedCableId = null; renderCables();
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - panStart.x;
        panY = e.clientY - panStart.y;
        updateTransform();
        return;
      }

      if (dragNode) {
        let x = (e.clientX / zoom) - dragOffset.x;
        let y = (e.clientY / zoom) - dragOffset.y;
        x = Math.max(0, Math.min(4000 - NODE_W, x));
        y = Math.max(0, Math.min(4000 - nodeHeightOf(dragNode), y));
        dragNode.x = x; dragNode.y = y;
        const el = canvas.querySelector(`.node[data-id= "${dragNode.id}"]`);
        if (el) { el.style.left = x + 'px'; el.style.top = y + 'px'; }
        renderCables();
      } else if (pendingConn) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / zoom;
        const y = (e.clientY - rect.top) / zoom;
        renderCables();
        const p1 = getPortPos(pendingConn.node, pendingConn.kind, pendingConn.idx);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', cableD(p1, { x, y }));
        path.setAttribute('stroke', '#a49d8f');
        path.setAttribute('stroke-width', '2.5');
        path.setAttribute('stroke-dasharray', '5 4');
        path.setAttribute('fill', 'none');
        svg.appendChild(path);
      }
    });

    document.addEventListener('mouseup', (e) => {
      if (isPanning) {
        isPanning = false;
        viewport.style.cursor = spacePressed ? 'grab' : '';
        return;
      }
      if (dragNode) { dragNode = null; }
      if (pendingConn) { tryCompleteConnection(e.target); pendingConn = null; renderCables(); }
    });

    // Zoom around a specific screen point (cursor for wheel, viewport center for the +/- buttons)
    // instead of always scaling from the canvas element's fixed (0,0) origin — that fixed-origin
    // scaling was the cause of zoom always appearing to pull everything toward the top-left corner.
    function zoomAt(clientX, clientY, factor) {
      const rect = viewport.getBoundingClientRect();
      const px = clientX - rect.left;
      const py = clientY - rect.top;
      const newZoom = Math.max(0.4, Math.min(1.5, zoom * factor));
      if (newZoom === zoom) return;
      panX = px - (px - panX) * (newZoom / zoom);
      panY = py - (py - panY) * (newZoom / zoom);
      zoom = newZoom;
      updateTransform();
    }

    // Zoom Interactions (Mouse Wheel)
    viewport.addEventListener('wheel', (e) => {
      if (e.ctrlKey || Math.abs(e.deltaY) > 0) {
        e.preventDefault();
        zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.1 : 1 / 1.1);
      }
    }, { passive: false });

    // Topbar Zoom Button UI — zoom around the center of the visible canvas area
    function zoomAtViewportCenter(factor) {
      const rect = viewport.getBoundingClientRect();
      zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, factor);
    }
    document.getElementById('zoomIn').addEventListener('click', () => zoomAtViewportCenter(1.1));
    document.getElementById('zoomOut').addEventListener('click', () => zoomAtViewportCenter(1 / 1.1));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (pendingConn) { pendingConn = null; renderCables(); }
        if (selectedCableId) { selectedCableId = null; renderCables(); }
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        const active = document.activeElement;
        const typing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable || active.tagName === 'SELECT');
        if (!typing && selectedCableId) { deleteConnection(selectedCableId); e.preventDefault(); }
      }
    });

    svg.addEventListener('mousedown', (e) => {
      const cablePath = e.target.closest('[data-cable]');
      if (cablePath) { selectedCableId = cablePath.dataset.cable; renderCables(); }
    });

    canvas.addEventListener('input', (e) => {
      const t = e.target;
      if (t.dataset.label) {
        const n = state.nodes.find(n => n.id === t.dataset.label);
        if (n) { n.label = t.value; t.title = t.value; }
      } else if (t.dataset.sub) {
        const n = state.nodes.find(n => n.id === t.dataset.sub);
        if (n) n.sub = t.value;
      } else if (t.dataset.portlabelIn) {
        const n = state.nodes.find(n => n.id === t.dataset.portlabelIn);
        const idx = parseInt(t.dataset.portlabelIdx, 10);
        if (n && n.inPorts[idx]) n.inPorts[idx].label = t.value;
      } else if (t.dataset.portlabelOut) {
        const n = state.nodes.find(n => n.id === t.dataset.portlabelOut);
        const idx = parseInt(t.dataset.portlabelIdx, 10);
        if (n && n.outPorts[idx]) n.outPorts[idx].label = t.value;
      }
    });

    canvas.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset.typepickId) {
        const n = state.nodes.find(n => n.id === t.dataset.typepickId);
        if (n) { if (t.dataset.typepickIo === 'in') n.nextInType = t.value; else n.nextOutType = t.value; }
      } else if (t.dataset.routeId) {
        const n = state.nodes.find(n => n.id === t.dataset.routeId);
        const idx = parseInt(t.dataset.routeIdx, 10);
        if (n && n.outPorts[idx]) { n.outPorts[idx].source = t.value === '' ? null : parseInt(t.value, 10); render(); }
      }
    });

    // --- Sidebar palette ---
    function buildSidebar() {
      const root = document.getElementById('paletteRoot');
      root.innerHTML = CAT_ORDER.map(cat => {
        const items = GEAR.map((g, idx) => ({ g, idx })).filter(x => x.g.cat === cat).map(({ g, idx }) =>
          ` <button class="palette-item" draggable = "true" style = "--nc:var(--${cat})" data-idx="${idx}" data-search="${esc(g.label.toLowerCase())}" > ${esc(g.label)}</button> `
        ).join('');
        return `<details class="cat-group" data-cat="${cat}">
      <summary><span class="swatch" style="background:var(--${cat})"></span>${esc(CATS[cat].label)}</summary>
      ${items}
    </details> `;
      }).join('');
    }
    buildSidebar();

    //Clicking an item on the sidebar places it on the canvas:

    document.getElementById('paletteRoot').addEventListener('click', (e) => {
      const btn = e.target.closest('.palette-item');
      if (!btn) return;
      const g = GEAR[parseInt(btn.dataset.idx, 10)];

      //The position at which to place it:
      const x = 0;
      const y = 0;

      if (g) { addNode(g, { x, y }); render(); }
    });


    // Drag a palette item onto the canvas to drop it exactly where the cursor lands
    document.getElementById('paletteRoot').addEventListener('dragstart', (e) => {
      const btn = e.target.closest('.palette-item');
      if (!btn) return;
      e.dataTransfer.setData('text/plain', btn.dataset.idx);
      e.dataTransfer.effectAllowed = 'copy';
    });

    viewport.addEventListener('dragover', (e) => {
      if (!e.dataTransfer.types.includes('text/plain')) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    viewport.addEventListener('drop', (e) => {
      const idxStr = e.dataTransfer.getData('text/plain');
      if (idxStr === '') return;
      e.preventDefault();
      const g = GEAR[parseInt(idxStr, 10)];
      if (!g) return;
      const rect = canvas.getBoundingClientRect();
      const x = Math.max(0, (e.clientX - rect.left) / zoom - NODE_W / 2);
      const y = Math.max(0, (e.clientY - rect.top) / zoom - 18);
      addNode(g, { x, y });
      render();

    function applyImportedState(parsed, fallbackName) {

      }));
      state.connections = parsed.connections;
      idCounter = parsed.idCounter || (state.nodes.reduce((m, n) => Math.max(m, parseInt(n.id.slice(1)) || 0), 0) + 1);

    //Save setup to cloud function
    async function saveRigToCloud(rigName, rigDataStructure) {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        await Dialog.alert('You must be signed in to save setups.', { kicker: 'ACCOUNT', title: 'Sign-in required' });
        return false;
      }

      // Double-check premium status before allowing the write
      const isPaid = await checkPremiumStatus(user);
      if (!isPaid) {
        await Dialog.alert('Cloud save needs a premium subscription. Taking you to checkout…', { kicker: 'UPGRADE', title: 'Premium required', okText: 'Continue', accent: 'accessory' });
        goToCheckout(user);
        return false;
      }

      // See if a rig with this name already exists for this user, so re-saving
      // overwrites it instead of piling up duplicate rows every click.
      const { data: existing, error: findError } = await supabaseClient
        .from('rigs')
        .select('id')
        .eq('user_id', user.id)
        .eq('name', rigName)
        .maybeSingle();

      if (findError) {
        console.error("Lookup error:", findError.message);
        await Dialog.alert('Failed to check for an existing save: ' + findError.message, { kicker: 'ERROR', title: 'Save Failed', accent: 'danger' });
        return false;
      }

      let saveError;
      if (existing) {
        const ok = await Dialog.confirm(`A saved rig named "${rigName}" already exists.Overwrite it ? `, { title: 'Overwrite existing save?', okText: 'Overwrite' });
        if (!ok) return false;
        const { error } = await supabaseClient.from('rigs').update({ data: rigDataStructure }).eq('id', existing.id);
        saveError = error;
      } else {
        const { error } = await supabaseClient
          .from('rigs')
          .insert([
            {
              user_id: user.id,
              name: rigName,
              data: rigDataStructure // This should be an object containing your canvas/knob states
            }
          ]);
        saveError = error;
      }

      if (saveError) {
        console.error("Save error:", saveError.message);
        await Dialog.alert('Failed to save configuration to cloud: ' + saveError.message, { kicker: 'ERROR', title: 'Save Failed', accent: 'danger' });
        return false;
      }

      await Dialog.alert('Your setup has been saved to the cloud!', { kicker: 'SUCCESS', title: 'Setup Saved', accent: 'daw' });
      return true;
    }

    //Load rigs from cloud function
    async function loadUserRigs() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return { rigs: [], error: null };

      const { data: owned, error } = await supabaseClient
        .from('rigs')
        .select('*')
        .eq('user_id', user.id); // Rigs this user created

      if (error) {
        console.error("Loading error:", error.message);
        return { rigs: [], error };
      }

      // Rigs someone else created but shared directly with this user.
      // Wrapped so a missing rig_shares table (before the SQL setup below is run)
      // just means "no shared rigs yet" instead of breaking the whole list.
      let sharedRigs = [];
      const { data: shares } = await supabaseClient
        .from('rig_shares')
        .select('rig_id')
        .eq('shared_with', user.id);

      if (shares && shares.length) {
        const { data: sharedData } = await supabaseClient
          .from('rigs')
          .select('*')
          .in('id', shares.map(s => s.rig_id));
        sharedRigs = sharedData || [];
      }

      const ownedTagged = (owned || []).map(r => ({ ...r, isOwner: true }));
      const sharedTagged = sharedRigs.map(r => ({ ...r, isOwner: false }));
      return { rigs: [...ownedTagged, ...sharedTagged], error: null }; // Array of accessible rigs
    }

    // === Cloud rig manager modal (Load from Cloud) ===

      async function refresh() {
        listEl.innerHTML = `<div class="rig-empty" > Loading…</div> `;
        const { rigs, error } = await loadUserRigs();

        if (error) {
          listEl.innerHTML = `<div class="rig-empty" > Couldn't load your saved rigs: ${esc(error.message)}</div>`;
          return;
        }
        if (!rigs.length) {
          listEl.innerHTML = `<div class="rig-empty">No saved rigs yet — use "Save to Cloud" first.</div>`;
          return;
        }

        rigs.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
        listEl.innerHTML = rigs.map(r => `
          <div class="rig-item">
            <div class="rig-item-info">
              <div class="rig-item-name">${esc(r.name || 'Untitled Setup')}${r.is_public ? '<span class="rig-public-badge">● public</span>' : ''}${!r.isOwner ? '<span class="rig-public-badge">● shared with you</span>' : ''}</div>

              <button class="btn" data-rig-load="${r.id}">Load</button>

              ${r.isOwner ? `<button class="btn danger" data-rig-del="${r.id}" title="Delete">×</button>` : ''}

          btn.addEventListener('click', () => removeRig(btn.dataset.rigDel));

      async function loadRig(rig) {
        if (!rig) return;
        if (state.nodes.length) {
          const ok = await Dialog.confirm('Loading will replace your current canvas. Unsaved changes will be lost.', { title: `Load "${rig.name}"?`, okText: 'Load' });

      async function removeRig(id) {

        const { error } = await supabaseClient.from('rigs').delete().eq('id', id);
        if (error) {
          await Dialog.alert('Could not delete: ' + error.message, { kicker: 'ERROR', title: 'Delete failed', accent: 'danger' });

        await refresh();

      return { open, refresh };

      async function togglePublic() {
        const next = !currentRig.is_public;
        const { error } = await supabaseClient.from('rigs').update({ is_public: next }).eq('id', currentRig.id);
        if (error) {
          await Dialog.alert('Could not update: ' + error.message, { kicker: 'ERROR', title: 'Update failed', accent: 'danger' });
          return;
        }
        currentRig.is_public = next;
        renderPublicToggle();
        await RigManager.refresh();
      }

      async function inviteByEmail() {
        const input = overlay.querySelector('#share-invite-email');
        const email = input.value.trim();
        if (!email) return;

        const { data: userId, error: lookupError } = await supabaseClient.rpc('find_user_id_by_email', { lookup_email: email });
        if (lookupError || !userId) {
          await Dialog.alert("No account found with that email — they'll need to sign up first.", { kicker: 'NOT FOUND', title: "Can't find that user", accent: 'danger' });
          return;
        }

        const { data: { user } } = await supabaseClient.auth.getUser();
        if (userId === user.id) {
          await Dialog.alert("That's your own account — you already have access.", { kicker: 'NOTICE', title: 'No need' });
          return;
        }

        const { error } = await supabaseClient.from('rig_shares').insert({ rig_id: currentRig.id, shared_with: userId });
        if (error && error.code !== '23505') { // 23505 = already shared, treat as success
          await Dialog.alert('Could not add: ' + error.message, { kicker: 'ERROR', title: 'Failed', accent: 'danger' });
          return;
        }
        input.value = '';
        await refreshPeople();
      }

      async function refreshPeople() {
        const peopleEl = overlay.querySelector('.share-people');
        peopleEl.innerHTML = `<div class="rig-empty">Loading…</div>`;
        const { data, error } = await supabaseClient
          .from('rig_shares')
          .select('shared_with, profiles(email)')
          .eq('rig_id', currentRig.id);

        if (error) {
          peopleEl.innerHTML = `<div class="rig-empty">Couldn't load: ${esc(error.message)}</div>`;
          return;
        }
        if (!data.length) {
          peopleEl.innerHTML = `<div class="rig-empty">No one yet — invite someone above.</div>`;
          return;
        }
        peopleEl.innerHTML = data.map(row => `
          <div class="share-person">
            <span>${esc(row.profiles && row.profiles.email ? row.profiles.email : 'Unknown user')}</span>
            <button class="btn danger" data-unshare="${row.shared_with}" title="Remove access">×</button>
          </div>`).join('');
        peopleEl.querySelectorAll('[data-unshare]').forEach(btn => {
          btn.addEventListener('click', () => removePerson(btn.dataset.unshare));
        });
      }

      async function removePerson(userId) {
        const { error } = await supabaseClient.from('rig_shares').delete().eq('rig_id', currentRig.id).eq('shared_with', userId);
        if (error) {
          await Dialog.alert('Could not remove: ' + error.message, { kicker: 'ERROR', title: 'Failed', accent: 'danger' });
          return;
        }
        await refreshPeople();
      }

      return { open };
    })();

    // === Load a shared rig if the URL has ?rig=<id> ===
    // Works whether the rig is public, or was shared directly with the signed-in visitor —
    // access is entirely decided by the Rigs table's RLS policies, not this code.
    (async function loadSharedRigFromUrl() {
      const rigId = new URLSearchParams(location.search).get('rig');
      if (!rigId) return;

      const { data, error } = await supabaseClient
        .from('rigs')
        .select('name, data')
        .eq('id', rigId)
        .maybeSingle();

      if (error || !data) {
        const { data: { user } } = await supabaseClient.auth.getUser();
        setStatus(user
          ? "This setup isn't public and hasn't been shared with your account."
          : 'Sign in to view this shared setup — or it may not be public.');
        return;
      }
      applyImportedState(data.data, data.name);
      setStatus('Loaded shared setup "' + (data.name || 'Untitled Setup') + '".');
    })();

    //Returning from Stripe checkout

      if (!checkoutResult) return;
